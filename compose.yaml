name: rft-observability-item35

services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.4
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "cub zk-ready localhost 2181 5"]
      interval: 10s
      timeout: 10s
      retries: 12
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-log:/var/lib/zookeeper/log
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.4.4
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b kafka:29092 1 30"]
      interval: 10s
      timeout: 35s
      retries: 12
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  kafka-init:
    image: confluentinc/cp-kafka:7.4.4
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/bash
      - -ec
      - |
        kafka-topics --bootstrap-server kafka:29092 \
          --create --if-not-exists \
          --topic rft.dev.observability.item.private.v1 \
          --partitions 1 \
          --replication-factor 1
    restart: "no"

  schema-registry:
    image: confluentinc/cp-schema-registry:7.4.4
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:8081/subjects >/dev/null"]
      interval: 10s
      timeout: 10s
      retries: 18
    restart: unless-stopped

  schema-init:
    image: curlimages/curl:8.10.1
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      schema-registry:
        condition: service_healthy
    command:
      - /bin/sh
      - -ec
      - |
        registry="http://schema-registry:8081"
        topic="rft.dev.observability.item.private.v1"

        curl --fail --silent --show-error \
          --request POST \
          --header "Content-Type: application/vnd.schemaregistry.v1+json" \
          --data '{"schema":"{\"type\":\"record\",\"name\":\"ItemId\",\"namespace\":\"com.sixgroup.refit.observability.topic.item\",\"fields\":[{\"name\":\"itemId\",\"type\":\"string\"}]}"}' \
          "$${registry}/subjects/$${topic}-key/versions"

        curl --fail --silent --show-error \
          --request POST \
          --header "Content-Type: application/vnd.schemaregistry.v1+json" \
          --data '{"schema":"{\"type\":\"record\",\"name\":\"ItemCommand\",\"namespace\":\"com.sixgroup.refit.observability.topic.item\",\"fields\":[{\"name\":\"itemId\",\"type\":\"string\"},{\"name\":\"itemType\",\"type\":\"string\"},{\"name\":\"command\",\"type\":\"string\"},{\"name\":\"itemDate\",\"type\":\"string\"},{\"name\":\"creationTimestamp\",\"type\":{\"type\":\"long\",\"logicalType\":\"timestamp-millis\"}},{\"name\":\"fileInfo\",\"type\":{\"type\":\"record\",\"name\":\"FileInfo\",\"fields\":[{\"name\":\"fileName\",\"type\":\"string\"},{\"name\":\"fileUrl\",\"type\":\"string\"}]}}]}"}' \
          "$${registry}/subjects/$${topic}-value/versions"
    restart: "no"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    depends_on:
      kafka:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
    ports:
      - "9080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: item35-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
      DYNAMIC_CONFIG_ENABLED: "false"
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 18
    restart: unless-stopped

  item35:
    image: rft-observability-item35-creator:compose
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
      schema-init:
        condition: service_completed_successfully
    ports:
      - "8042:8042"
      - "9040:9040"
    environment:
      SPRING_PROFILES_ACTIVE: compose,uk
    volumes:
      - ./source/src/main/resources/reports:/data/reports
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:9040/actuator/health/readiness >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s
    restart: unless-stopped

volumes:
  kafka-data:
  zookeeper-data:
  zookeeper-log:
