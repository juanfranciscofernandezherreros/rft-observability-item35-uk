server:
  port: 8040

management:
  server:
    port: 9040

spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: "localhost:9092"
    producer:
      client-id: ${spring.application.name}
      key-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
      properties:
        "schema.registry.url": mock://not-used
        "avro.remove.java.properties": true
    consumer:
      group-id: ${spring.application.name}
      auto-offset-reset: earliest
      key-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      value-deserializer: io.confluent.kafka.serializers.KafkaAvroDeserializer
      properties:
        "schema.registry.url": mock://not-used
        "specific.avro.reader": true
  datasource:
    kududb:
      jdbc-url: jdbc:h2:mem:kudu;INIT=RUNSCRIPT FROM 'classpath:db/sqlServer/init_kudu.sql'
      username: sa
      password:
      driver-class-name: org.h2.Driver
      dialect: org.hibernate.dialect.HSQLDialect
      ddl-auto: validate
      persistence-unit: kududb
      schema: EMIR_REFIT_DEV_CONTROL_REFIT
    sqlserverdb:
      jdbc-url: jdbc:h2:mem:DBO;MODE=MSSQLServer;INIT=RUNSCRIPT FROM 'classpath:db/sqlServer/init_mssql.sql' # init=CREATE SCHEMA DBO,CREATE TABLE RECOSTATS;
      username: sa
      password:
      driver-class-name: org.h2.Driver
      dialect: org.hibernate.dialect.SQLServer2012Dialect
      ddl-auto: validate
      persistence-unit: sqlserverdb
      schema: dbo

api:
  cloudera:
    username:
    password:
    host: https://mqmblclutil01.internal.six-group.net
    port: 7183
    url: /api/v54/timeseries

component-config:
  TR_CODE: TRRGS
  REGULATION_REFERENCE: EMIR
  PARTICIPANT:
    REPORT_TYPE: PARTICIPANT
    REPORT_TYPE_QUERY:
      - TAR030
      - TAR108
      - TSR107
      - TSR109
      - RJ092
      - RJCT000
    TYPES:
      TAR030:
        REPORT_NAME: TAR030
        SLA: yyyy-MM-ddT06:00:00Z
      TAR108:
        REPORT_NAME: TAR108
        SLA: yyyy-MM-ddT06:00:00Z
      TSR107:
        REPORT_NAME: TSR107
        SLA: yyyy-MM-ddT06:00:00Z
      TSR109:
        REPORT_NAME: TSR109
        SLA: yyyy-MM-ddT06:00:00Z
      RJ092:
        REPORT_NAME: RJ092
        SLA: yyyy-MM-ddT06:00:00Z
      RJCT000:
        REPORT_NAME: RJCT000
        SLA: yyyy-MM-ddT06:00:00Z
  REGULATOR:
    REPORT_TYPE_ESMA: ESMA
    REPORT_TYPE_NCA: NCA
    REPORT_TYPE_QUERY:
      - TAR030
      - TAR108
      - TSR107
      - TSR109
      - RJ092
      - RJCT000
    TYPES:
      TAR030:
        REPORT_NAME: TAR030
        SLA: yyyy-MM-ddT12:00:00Z
        INIT: yyyy-MM-ddT00:00:00Z
      TAR108:
        REPORT_NAME: TAR108
        SLA: yyyy-MM-ddT12:00:00Z
        INIT: yyyy-MM-ddT00:00:00Z
      TSR107:
        REPORT_NAME: TSR107
        SLA: yyyy-MM-ddT12:00:00Z
        INIT: yyyy-MM-ddT00:00:00Z
      TSR109:
        REPORT_NAME: TSR109
        SLA: yyyy-MM-ddT12:00:00Z
        INIT: yyyy-MM-ddT00:00:00Z
      RJ092:
        REPORT_NAME: RJ092
        SLA: yyyy-MM-ddT12:00:00Z
        INIT: yyyy-MM-ddT00:00:00Z
      RJCT000:
        REPORT_NAME: RJCT000
        SLA: yyyy-MM-ddT12:00:00Z
        INIT: yyyy-MM-ddT00:00:00Z
  TR:
    REPORT_TYPE: TR
    REPORT_TYPE_QUERY:
      - RL078
      - TD107
    TYPES:
      RL:
        REPORT_NAME: RL
        SLA: yyyy-MM-ddT12:00:00Z
        INIT: yyyy-MM-ddT00:00:00Z
      TD:
        REPORT_NAME: TD
        SLA: yyyy-MM-ddT12:00:00Z
        INIT: yyyy-MM-ddT00:00:00Z
      RL078:
        REPORT_NAME: RL078
        SLA: yyyy-MM-ddT12:00:00Z
        INIT: yyyy-MM-ddT00:00:00Z
      TD107:
        REPORT_NAME: TD107
        SLA: yyyy-MM-ddT12:00:00Z
        INIT: yyyy-MM-ddT00:00:00Z

  csv:
    output_path: "work-repository-observability/upload/"
  topics:
    observability-item-topic: rft.dev.observability.item.private.v1
    observability-item-consumer-group-id: rft.dev.rft-observability-item35-creator
  db:
    schema: EMIR_REFIT_DEV_CONTROL_REFIT
  api:
    cloudera:
      cpu:
        enabled: false
        selectCpu: select cpu_percent_across_hosts where category=CLUSTER
        desiredRollup: DAILY
      ram:
        enabled: false
        selectRam: select physical_memory_used
        desiredRollup: DAILY
      storage:
        selectTotalApi: select total_capacity_across_filesystems
        selectFreeApi: select total_capacity_free_across_filesystems
        desiredRollup: DAILY
        enabled: false

logging:
  level:
    org:
      hibernate:
        type:
          descriptor:
            sql: trace
    root: INFO
    "org.apache.kafka": INFO
    "com.sixgroup.refit": DEBUG
